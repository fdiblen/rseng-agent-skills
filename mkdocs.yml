site_name: rseng-agent-skills
site_description: >-
  Research software engineering skills for AI coding agents, with
  pluggable content sources.
repo_url: https://github.com/fdiblen/rseng-agent-skills
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User guide:
      - Quickstart: user/quickstart.md
      - Installing per agent: user/installing.md
      - Using the skills: user/using.md
      - Updating and troubleshooting: user/updating.md
  - Developer guide:
      - Architecture: dev/architecture.md
      - Content pipeline: dev/pipeline.md
      - Content sources: dev/content-sources.md
      - External skills catalog: dev/catalog.md
      - Taxonomy: dev/taxonomy.md
      - Adding a skill: dev/adding-a-skill.md
      - Adding an adapter: dev/adding-an-adapter.md
      - Release and sync: dev/release-and-sync.md
      - Skill authoring template: dev/skill-authoring-template.md

copyright: >-
  Content adapted in part from RSQKit (EVERSE project) and the
  Netherlands eScience Center Software Development Guide, both
  CC-BY-4.0.
