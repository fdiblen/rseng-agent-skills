name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate skills (agentskills reference tooling)
        run: |
          for skill in skills/rseng-*/; do
            npx -y skills-ref@0.1.5 validate "$skill"
          done
      - name: Validate Claude plugin
        run: npx -y @anthropic-ai/claude-code@2.1.258 plugin validate . --strict

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: |
          uvx ruff@0.16.5 check pipeline hooks adapters
          uvx ruff@0.16.5 format --check pipeline hooks adapters
          uvx --with charset-normalizer --from reuse reuse lint
      - name: Hook behaviour tests
        run: uv run --directory pipeline --group dev pytest ../hooks/tests -q
      - name: Skill frontmatter lint
        run: uv run --directory pipeline python -m rseng_pipeline.skill_lint
      - name: Build artifacts and adapters (with output checks)
        run: |
          uv run --directory pipeline python -m rseng_pipeline.references
          uv run --directory pipeline python -m rseng_pipeline.related_skills
          uv run --directory pipeline python -m rseng_pipeline.skill_directory
          uv run --directory pipeline python -m rseng_pipeline.token_budget
          uv run --directory pipeline python -m rseng_pipeline.build_adapters
      - name: README table and counts must match committed ones
        run: |
          uv run --directory pipeline python -m rseng_pipeline.readme_skills
          git diff --exit-code README.md AGENTS.md hooks .claude-plugin docs/user/quickstart.md docs/user/installing.md docs/index.md codemeta.json .zenodo.json
      - name: Generated references must match committed ones
        run: git diff --exit-code skills
      - name: Catalog hygiene
        run: uv run --directory pipeline python -m rseng_pipeline.catalog check

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and lint
        working-directory: installer
        run: |
          npm ci
          npm run build
          npm test
          npx biome ci src tests
