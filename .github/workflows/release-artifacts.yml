name: release-artifacts

on:
  release:
    types: [published]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build adapters
        run: |
          uv run --directory pipeline python -m rseng_pipeline.fetcher
          uv run --directory pipeline python -m rseng_pipeline.assembler
          uv run --directory pipeline python -m rseng_pipeline.references
          uv run --directory pipeline python -m rseng_pipeline.build_adapters
      - name: Zip per agent target
        run: |
          cd dist
          for target in */; do
            name="${target%/}"
            zip -qr "rseng-agent-skills-${name}.zip" "$name"
          done
          ls -l ./*.zip
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
