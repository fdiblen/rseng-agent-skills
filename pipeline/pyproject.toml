[project]
name = "rseng-agent-skills-pipeline"
version = "0.1.0"
description = "Build pipeline deriving references, relations, directories and adapter outputs from the skills"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.3.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rseng_pipeline"]
