[project]
name = "rseng-agent-skills-pipeline"
version = "0.1.0"
description = "Content pipeline that turns pinned RSQKit sources into skill references and adapter inputs"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.1.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rseng_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
