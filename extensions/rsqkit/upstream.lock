# Pinned upstream source of truth for the content pipeline.
# The sync workflow updates this pin; avoid editing it by hand.

[upstream]
repo = "https://github.com/EVERSE-ResearchSoftware/RSQKit"
ref = "main"
commit = "03a8352e0701acf6ae28a1f6c9069e9b2caf8e7e"

[sources]
# Directories holding the page content the pipeline consumes.
paths = [
    "pages/tasks/",
    "pages/roles/",
    "pages/research_software_and_quality/",
]
# Registry data files.
data_globs = [
    "_data/*.yml",
]
