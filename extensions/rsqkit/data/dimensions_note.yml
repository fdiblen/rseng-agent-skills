# Resolution of the quality dimension count, for use by skill authoring.
#
# Verified against the pinned upstream commit (see pipeline/upstream.lock):
# _data/quality_dimensions.yml (the canonical rsqd JSON-LD registry,
# https://w3id.org/everse/rsqd) defines exactly 13 dimensions. The rendered
# site has shown a conflicting count of 12 in page prose in the past; at the
# pinned commit the quality_dimensions page renders its list directly from
# the registry and states no literal count, and the "nine dimensions"
# mention on that page refers to the ISO/IEC 25010 top-level set the EVERSE
# dimensions build on, not to the EVERSE set itself.
canonical_count: 13
canonical_source: _data/quality_dimensions.yml
schema: https://w3id.org/everse/rsqd
dimensions:
  - community
  - compatibility
  - fairness
  - flexibility
  - functional_suitability
  - interaction_capability
  - maintainability
  - open_source_software
  - performance_efficiency
  - reliability
  - safety
  - security
  - sustainability
authoring_rule: >-
  Always derive dimension names and counts from the registry, never from
  page prose. If prose and registry disagree, the registry wins and the
  disagreement is an upstream finding to report.
known_registry_defects:
  - indicator support_issue_tracking references the maintainability
    dimension with a trailing space in its IRI (normalized by the loader)
  - indicator has_contribution_guidelines references "sustaintability",
    a misspelling of sustainability (left unresolved; report upstream)
